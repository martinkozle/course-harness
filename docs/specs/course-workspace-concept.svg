    <tspan x="288">Create an opening Lecture from</tspan>
    <tspan x="288" dy="25">these papers. Start with the</tspan>
    <tspan x="288" dy="25">counterfactual question.</tspan>
  </text>
  <text x="240" y="246" class="strong">Course Agent</text>
  <text x="240" y="278">
    <tspan x="240">I drafted six Slides for Foundations.</tspan>
    <tspan x="240" dy="27">The opening example compares the</tspan>
    <tspan x="240" dy="27">same person under two treatments.</tspan>
  </text>
