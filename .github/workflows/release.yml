name: Release

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - frontend/**
      - src/**
      - scripts/verify_distribution.py
      - package.json
      - bun.lock
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.28"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv version --short --color never)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      # The wheel ships the committed React bundle, so a stale bundle would ship a stale interface.
      - name: Check that the committed frontend bundle is current
        run: |
          bun install --frozen-lockfile
          bun run build
          if [[ -n "$(git status --porcelain -- src/course_harness/static)" ]]; then
            git status --short -- src/course_harness/static
            echo "::error::src/course_harness/static is stale; run 'bun run build' and commit it"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test uvx, uv tool, and Git installations
        run: uv run python scripts/verify_distribution.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/course-harness/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.28"

      - name: Publish
        run: uv publish --trusted-publishing always

  github-release:
    name: Attach the distribution to the GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # A Release drafted in the GitHub UI already exists; a plain tag push gets generated notes.
      - name: Create or update the Release
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
