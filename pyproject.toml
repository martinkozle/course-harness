[project]
name = "course-harness"
version = "0.3.0"
description = "A local-first workspace for authoring source-grounded courses"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["course-authoring", "local-first", "presentations", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = [
  "docling>=2.59",
  "fastapi",
  # pydantic-ai 2.13 reads MCP SDK v1 field names; fastmcp 4 moved to SDK v2.
  "fastmcp-slim[client]<4",
  "httpx",
  "httpx2",
  "keyring>=25.6",
  "pillow>=12.3.0",
  "pydantic-ai-slim[ag-ui,anthropic,bedrock,mcp,openai]",
  "python-multipart>=0.0.32",
  "python-pptx>=1.0.2",
  "pyyaml>=6.0.3",
  "torch",
  "torchvision",
  "typer",
  "uvicorn[standard]",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
course-harness = "course_harness.cli:main"

[project.urls]
Homepage = "https://github.com/martinkozle/course-harness"
Repository = "https://github.com/martinkozle/course-harness"
Issues = "https://github.com/martinkozle/course-harness/issues"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  # In-process MCP servers stand in for Connectors in tests.
  "fastmcp-slim[server]<4",
  "pypdf>=6.0",
  "pytest",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
"no-matching-overload" = "ignore"
