# Workspace root: not a distribution. `course-harness` (packages/harness) is the only package
# published to PyPI; `course-harness-classroom` (packages/classroom) is deployed, not published.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
course-harness = { workspace = true }
course-harness-classroom = { workspace = true }

[dependency-groups]
dev = [
  "course-harness",
  "course-harness-classroom",
  # In-process MCP servers stand in for Connectors in tests.
  "fastmcp-slim[server]>=4",
  "pypdf>=6.0",
  "pytest",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages/harness/tests", "packages/classroom/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Sorts the workspace packages as first-party imports.
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["packages/*/src", "packages/*/tests", "tests"]

[tool.ty.rules]
"no-matching-overload" = "ignore"
