[project]
name = "course-harness"
version = "0.1.0"
description = "A local-first workspace for authoring source-grounded courses"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi",
  "pydantic-ai-slim[ag-ui,anthropic,openai]",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "typer",
  "uvicorn[standard]",
]

[project.scripts]
course-harness = "course_harness.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
