[project]
name = "course-harness-classroom"
version = "0.1.0"
description = "A self-hostable classroom that serves published Course Harness Releases to students"
requires-python = ">=3.14,<3.15"
license = "MIT"
# Deployed from this repository, never published to a package index.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "fastapi",
  "typer",
  "uvicorn[standard]",
  # The light dependencies of `course_harness.core`. The Classroom imports core but never installs
  # Course Harness: the dev workspace takes core from the editable Harness install (the root dev
  # group), and the Docker image copies only `course_harness/__init__.py` and
  # `course_harness/core/` (ADR 0017).
  "pillow>=12.3.0",
  "pydantic>=2.12",
  "python-pptx>=1.0.2",
  "pyyaml>=6.0.3",
]

[project.scripts]
course-classroom = "course_harness_classroom.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"
