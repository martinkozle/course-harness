# Course Harness Classroom behind a reverse proxy on the same host. See docs/deploy-classroom.md.
#
#   cp .env.example .env    # then set CLASSROOM_ADMIN_TOKEN and CLASSROOM_PUBLIC_URL
#   docker compose up -d --build
name: course-harness-classroom

services:
  classroom:
    build:
      context: .
      dockerfile: packages/classroom/Dockerfile
    image: course-harness-classroom:local
    restart: unless-stopped
    init: true
    # Every setting in .env reaches the Classroom (see CONTRIBUTING.md for all CLASSROOM_*
    # variables); `environment` below adds the required ones and the deployment's defaults.
    env_file:
      - path: .env
        required: false
    environment:
      CLASSROOM_ADMIN_TOKEN: ${CLASSROOM_ADMIN_TOKEN:?Set CLASSROOM_ADMIN_TOKEN in .env}
      CLASSROOM_PUBLIC_URL: ${CLASSROOM_PUBLIC_URL:?Set CLASSROOM_PUBLIC_URL in .env}
      # A reverse proxy on the host reaches the container through the gateway of the network
      # below, so only that address may set X-Forwarded-For. Without it, every Learner shares
      # the proxy's address for rate limits.
      CLASSROOM_TRUSTED_PROXIES: ${CLASSROOM_TRUSTED_PROXIES:-172.29.81.1}
      # LibreOffice renders untrusted templates only in its network-less sandbox; where it cannot
      # be created, slides get plain backgrounds instead.
      CLASSROOM_RENDER_SANDBOX: ${CLASSROOM_RENDER_SANDBOX:-required}
    ports:
      # Only the host's reverse proxy reaches the Classroom; it terminates TLS.
      - "127.0.0.1:${CLASSROOM_PORT:-8000}:8000"
    networks:
      - classroom
    volumes:
      - classroom-data:/data
    read_only: true
    tmpfs:
      # LibreOffice profiles, rendered slides before they are moved to /data, and Git's temp files.
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile plus unshare of a user and network namespace, for the
      # LibreOffice sandbox (packages/classroom/docker/make_seccomp_profile.py).
      - seccomp=packages/classroom/docker/seccomp-classroom.json
    pids_limit: 512
    mem_limit: 2g

networks:
  classroom:
    ipam:
      config:
        # A fixed subnet, so the gateway the host's proxy connects from is a known address.
        # Change both if it collides with a network of yours.
        - subnet: 172.29.81.0/24
          gateway: 172.29.81.1

volumes:
  classroom-data:
